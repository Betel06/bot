<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrUp" markerWidth="12" markerHeight="12" refX="6" refY="2" orient="auto">
      <path d="M0,8 L6,0 L12,8" fill="#26a69a"/>
    </marker>
    <marker id="arrTarget" markerWidth="12" markerHeight="12" refX="6" refY="2" orient="auto">
      <path d="M0,8 L6,0 L12,8" fill="#ffa726"/>
    </marker>
  </defs>

  <!-- fundo -->
  <rect width="1000" height="620" fill="#1b1f29"/>
  <rect x="40" y="68" width="920" height="500" fill="#161a22" stroke="#2a3" stroke-opacity="0.1"/>

  <!-- titulo -->
  <text x="500" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#e8e8e8">SMC 2TF — Sinal de pivo validado (24h)</text>
  <text x="500" y="54" text-anchor="middle" font-size="13" fill="#aab">Tendencia H1 (setup) + pivo da correcao (TF menor) + RSI valida + volta no 50%</text>

  <!-- faixa do 50% -->
  <rect x="40" y="268" width="920" height="84" fill="#ffa726" opacity="0.10"/>
  <line x1="40" y1="310" x2="960" y2="310" stroke="#ffa726" stroke-width="2" stroke-dasharray="10 5"/>
  <text x="54" y="303" font-size="12" fill="#ffa726" font-weight="bold">Nivel 50% (H1)</text>

  <!-- topo/fundo H1 -->
  <line x1="40" y1="100" x2="960" y2="100" stroke="#ef5350" stroke-width="2" stroke-dasharray="8 6" stroke-opacity="0.8"/>
  <text x="820" y="92" font-size="12" fill="#ef5350">Topo (H1) = alvo</text>
  <line x1="40" y1="520" x2="960" y2="520" stroke="#26a69a" stroke-width="2" stroke-dasharray="8 6" stroke-opacity="0.8"/>
  <text x="820" y="534" font-size="12" fill="#26a69a">Fundo (H1)</text>

  <!-- velas -->
  <!-- b1 -->
  <line x1="80" y1="150" x2="80" y2="210" stroke="#ef5350" stroke-width="2"/>
  <rect x="67" y="155" width="26" height="45" fill="#ef5350"/>
  <!-- b2 -->
  <line x1="135" y1="195" x2="135" y2="260" stroke="#ef5350" stroke-width="2"/>
  <rect x="122" y="205" width="26" height="45" fill="#ef5350"/>
  <!-- b3 -->
  <line x1="190" y1="255" x2="190" y2="320" stroke="#ef5350" stroke-width="2"/>
  <rect x="177" y="260" width="26" height="55" fill="#ef5350"/>
  <!-- b4 -->
  <line x1="245" y1="310" x2="245" y2="385" stroke="#ef5350" stroke-width="2"/>
  <rect x="232" y="320" width="26" height="60" fill="#ef5350"/>
  <!-- b5 fundo -->
  <line x1="300" y1="380" x2="300" y2="435" stroke="#ef5350" stroke-width="2"/>
  <rect x="287" y="385" width="26" height="45" fill="#ef5350"/>
  <!-- b6 bounce -->
  <line x1="355" y1="380" x2="355" y2="430" stroke="#26a69a" stroke-width="2"/>
  <rect x="342" y="390" width="26" height="35" fill="#26a69a"/>
  <!-- b7 dip -->
  <line x1="400" y1="385" x2="400" y2="420" stroke="#ef5350" stroke-width="2"/>
  <rect x="387" y="405" width="26" height="10" fill="#ef5350"/>
  <!-- b8 break -->
  <line x1="445" y1="345" x2="445" y2="415" stroke="#26a69a" stroke-width="2"/>
  <rect x="432" y="350" width="26" height="50" fill="#26a69a"/>
  <!-- b9 retrace -->
  <line x1="500" y1="290" x2="500" y2="345" stroke="#ef5350" stroke-width="2"/>
  <rect x="487" y="300" width="26" height="35" fill="#ef5350"/>
  <!-- b10 -->
  <line x1="545" y1="295" x2="545" y2="340" stroke="#ef5350" stroke-width="2"/>
  <rect x="532" y="305" width="26" height="25" fill="#ef5350"/>
  <!-- b11 -->
  <line x1="590" y1="300" x2="590" y2="335" stroke="#ef5350" stroke-width="2"/>
  <rect x="577" y="310" width="26" height="15" fill="#ef5350"/>
  <!-- b12 entrada -->
  <line x1="635" y1="305" x2="635" y2="330" stroke="#26a69a" stroke-width="2"/>
  <rect x="622" y="315" width="26" height="7" fill="#26a69a"/>
  <!-- b13 rally -->
  <line x1="690" y1="200" x2="690" y2="320" stroke="#26a69a" stroke-width="2"/>
  <rect x="677" y="230" width="26" height="40" fill="#26a69a"/>
  <!-- b14 -->
  <line x1="745" y1="150" x2="745" y2="230" stroke="#26a69a" stroke-width="2"/>
  <rect x="732" y="170" width="26" height="45" fill="#26a69a"/>
  <!-- b15 -->
  <line x1="800" y1="120" x2="800" y2="200" stroke="#26a69a" stroke-width="2"/>
  <rect x="787" y="140" width="26" height="40" fill="#26a69a"/>
  <!-- b16 -->
  <line x1="855" y1="105" x2="855" y2="180" stroke="#26a69a" stroke-width="2"/>
  <rect x="842" y="118" width="26" height="32" fill="#26a69a"/>

  <!-- marca fundo da correcao (verde) -->
  <line x1="300" y1="435" x2="620" y2="435" stroke="#26a69a" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="315" y="450" font-size="12" fill="#26a69a" font-weight="bold">Fundo da correcao (marca)</text>

  <!-- marca topo da correcao (vermelha) -->
  <line x1="355" y1="380" x2="520" y2="380" stroke="#ef5350" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="370" y="372" font-size="12" fill="#ef5350" font-weight="bold">Topo da correcao (marca — some ao romper)</text>

  <!-- seta do rompimento -->
  <line x1="445" y1="365" x2="500" y2="250" stroke="#26a69a" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrUp)"/>
  <text x="505" y="248" font-size="13" fill="#26a69a" font-weight="bold">Fechou acima do topo + RSI &ge; 50 = pivo VALIDO</text>

  <!-- seta de entrada -->
  <line x1="635" y1="340" x2="700" y2="418" stroke="#26a69a" stroke-width="2"/>
  <path d="M680,398 l28,-30 l-2,34 z" fill="#26a69a"/>
  <text x="692" y="432" font-size="13" fill="#26a69a" font-weight="bold">ENTRADA LONG no 50%</text>

  <!-- stop -->
  <line x1="620" y1="445" x2="880" y2="445" stroke="#ef5350" stroke-width="3" stroke-dasharray="6 5"/>
  <text x="652" y="460" font-size="13" fill="#ef5350" font-weight="bold">STOP: abaixo do ultimo fundo</text>

  <!-- alvo -->
  <line x1="810" y1="160" x2="868" y2="108" stroke="#ffa726" stroke-width="2" marker-end="url(#arrTarget)"/>
  <text x="700" y="78" font-size="13" fill="#ffa726" font-weight="bold">ALVO: Topo H1</text>

  <!-- pasos -->
  <circle cx="300" cy="470" r="12" fill="#3949ab"/>
  <text x="300" y="475" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">1</text>
  <circle cx="445" cy="470" r="12" fill="#3949ab"/>
  <text x="445" y="475" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">2</text>
  <circle cx="635" cy="470" r="12" fill="#3949ab"/>
  <text x="635" y="475" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">3</text>

  <!-- painel RSI -->
  <rect x="690" y="490" width="268" height="118" rx="8" fill="#232a36" stroke="#3949ab" stroke-width="1.5"/>
  <text x="702" y="510" font-size="12" fill="#e8e8e8" font-weight="bold">RSI 14 — valida o rompimento</text>
  <line x1="700" y1="545" x2="948" y2="545" stroke="#ffa726" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="952" y="549" font-size="11" fill="#ffa726">50</text>
  <!-- rsi polyline -->
  <polyline points="700,558 717,552 734,566 751,574 768,578 785,572 802,562 819,550 836,545 853,541 870,537 887,533 904,521 921,507 938,493 948,482"
    fill="none" stroke="#26a69a" stroke-width="2.5"/>
  <circle cx="819" cy="550" r="5" fill="#26a69a"/>
  <text x="805" y="592" font-size="11" fill="#9fb">cruza o 50 no rompimento</text>
</svg>