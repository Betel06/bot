<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580">
  <rect width="960" height="580" fill="#131722"/>
  <text x="30" y="38" fill="#fff" font-family="Arial" font-size="20" font-weight="bold">Mini-CHoCH em estrutura de ALTA (LONG)</text>
  <text x="30" y="62" fill="#787b86" font-family="Arial" font-size="14">1) Correção desce fazendo topos/fundos menores ate o equilibrio · 2) Sweep captura a liquidez · 3) Candle forte fecha acima do ultimo mini-topo = confirmacao</text>

  <!-- NIVEIS -->
  <line x1="30" y1="280" x2="920" y2="280" stroke="#2962ff" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="32" y="272" fill="#90caf9" font-family="Arial" font-size="14" font-weight="bold">ALVO (topo anterior / DOL)</text>

  <line x1="30" y1="400" x2="920" y2="400" stroke="#ff9800" stroke-width="3" stroke-dasharray="9 5"/>
  <text x="32" y="390" fill="#ffb74d" font-family="Arial" font-size="14" font-weight="bold">NIVEL 50% (equilibrium)</text>

  <line x1="200" y1="330" x2="920" y2="330" stroke="#787b86" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="205" y="322" fill="#b2b5be" font-family="Arial" font-size="13">LH3 = ultimo mini-topo da correcao</text>

  <line x1="30" y1="425" x2="920" y2="425" stroke="#ff5252" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="32" y="445" fill="#ff8a80" font-family="Arial" font-size="14" font-weight="bold">STOP (abaixo do sweep/fundo)</text>

  <!-- CANDLES: linha = pavio, retangulo = corpo -->
  <!-- c1 bull -->
  <line x1="38" y1="340" x2="38" y2="400" stroke="#26a69a" stroke-width="3"/>
  <rect x="30" y="350" width="16" height="40" fill="#26a69a"/>
  <!-- c2 bull -->
  <line x1="113" y1="310" x2="113" y2="372" stroke="#26a69a" stroke-width="3"/>
  <rect x="105" y="320" width="16" height="40" fill="#26a69a"/>
  <!-- c3 bull (topo antigo) -->
  <line x1="188" y1="280" x2="188" y2="342" stroke="#26a69a" stroke-width="3"/>
  <rect x="180" y="290" width="16" height="40" fill="#26a69a"/>
  <!-- c4 bear LH1 -->
  <line x1="263" y1="285" x2="263" y2="345" stroke="#ef5350" stroke-width="3"/>
  <rect x="255" y="300" width="16" height="30" fill="#ef5350"/>
  <!-- c5 bear LH2 -->
  <line x1="338" y1="315" x2="338" y2="360" stroke="#ef5350" stroke-width="3"/>
  <rect x="330" y="325" width="16" height="20" fill="#ef5350"/>
  <!-- c6 bear LH3 -->
  <line x1="413" y1="330" x2="413" y2="390" stroke="#ef5350" stroke-width="3"/>
  <rect x="405" y="340" width="16" height="30" fill="#ef5350"/>
  <!-- c7 bear sweep -->
  <line x1="488" y1="350" x2="488" y2="415" stroke="#ef5350" stroke-width="3"/>
  <rect x="480" y="365" width="16" height="25" fill="#ef5350"/>
  <!-- c8 bull CHoCH -->
  <line x1="563" y1="300" x2="563" y2="405" stroke="#26a69a" stroke-width="3"/>
  <rect x="555" y="315" width="16" height="65" fill="#26a69a"/>
  <!-- c9 bull -->
  <line x1="638" y1="265" x2="638" y2="345" stroke="#26a69a" stroke-width="3"/>
  <rect x="630" y="275" width="16" height="55" fill="#26a69a"/>
  <!-- c10 bull -> alvo -->
  <line x1="713" y1="244" x2="713" y2="300" stroke="#26a69a" stroke-width="3"/>
  <rect x="705" y="250" width="16" height="35" fill="#26a69a"/>

  <!-- DESTAQUES -->
  <circle cx="488" cy="415" r="6" fill="none" stroke="#ffb74d" stroke-width="2"/>
  <text x="502" y="438" fill="#ffb74d" font-family="Arial" font-size="13">SWEEP (pega os stops)</text>

  <line x1="563" y1="330" x2="590" y2="330" stroke="#66bb6a" stroke-width="4"/>
  <text x="596" y="335" fill="#66bb6a" font-family="Arial" font-size="15" font-weight="bold">Mini-CHoCH: fecha acima do LH3</text>

  <polygon points="563,300 555,318 571,318" fill="#66bb6a"/>
  <text x="540" y="288" fill="#fff" font-family="Arial" font-size="15" font-weight="bold">ENTRADA</text>

  <!-- RR -->
  <line x1="820" y1="290" x2="880" y2="290" stroke="#26a69a" stroke-width="3"/>
  <line x1="880" y1="290" x2="880" y2="425" stroke="#ef5350" stroke-width="3"/>
  <text x="824" y="282" fill="#26a69a" font-family="Arial" font-size="14" font-weight="bold">R = 135</text>
  <text x="886" y="365" fill="#ef5350" font-family="Arial" font-size="14" font-weight="bold">R:R &gt;= 1.5</text>
</svg>